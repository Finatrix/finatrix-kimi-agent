<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#060607" />
    <!-- Dev + fallback CSP. Production delivers the same policy (plus
         frame-ancestors) as an HTTP header — see public/_headers. Keep the
         two byte-identical: differing policies enforce their intersection. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-8sIkMSAQhH4cmqemj6kE1Bs/6aBQrXGsMGgKxYpye5g='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />

    <!-- No-flash theme boot: set data-theme from saved preference or OS before
         first paint. Kept in sync with the sha256 in the CSP above; if this
         script changes, recompute the hash. Mirrors ThemeContext defaults. -->
    <script>(function(){try{var d=document.documentElement;var t=localStorage.getItem('fx_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}d.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute('content',t==='light'?'#F4F2EC':'#060607');}}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>

    <!-- Fonts are self-hosted; preload the two render-critical variable fonts. -->
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Primary meta -->
    <title>FinatriX — Smart Money Tools for India</title>
    <meta
      name="description"
      content="FinatriX is a free, education-first toolkit for India: Budget Builder, Expense Tracker, InvestMatch, ParkSmart, PeerCompare, Reverse Goal Planner and LifeMap. Educational tools, not financial advice."
    />
    <meta name="author" content="FinatriX" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://finatrix.online/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/images/finatrix-logo.png" />
    <link rel="apple-touch-icon" href="/images/finatrix-logo.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinatriX" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FinatriX" />
    <meta property="og:title" content="FinatriX — Smart Money Tools for India" />
    <meta
      property="og:description"
      content="Seven free, education-first money tools for India — budgeting, investing, benchmarking and a full life-long wealth simulation."
    />
    <meta property="og:url" content="https://finatrix.online/" />
    <meta
      property="og:image"
      content="https://finatrix.online/images/finatrix-wordmark.jpg"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@finatrix_" />
    <meta name="twitter:title" content="FinatriX — Smart Money Tools for India" />
    <meta
      name="twitter:description"
      content="Seven free, education-first money tools for India. Educational tools, not financial advice."
    />
    <meta
      name="twitter:image"
      content="https://finatrix.online/images/finatrix-wordmark.jpg"
    />

    <!-- Structured data: Organization (brand signal) + WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://finatrix.online/#org",
            "name": "FinatriX",
            "url": "https://finatrix.online/",
            "logo": "https://finatrix.online/images/finatrix-logo.png",
            "email": "finatrix.hub@gmail.com",
            "description": "Free, education-first personal-finance tools for India.",
            "sameAs": ["https://twitter.com/finatrix_"]
          },
          {
            "@type": "WebApplication",
            "name": "FinatriX",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "url": "https://finatrix.online/",
            "description": "Free, education-first personal-finance tools for India. Educational tools, not financial advice.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
            "publisher": { "@id": "https://finatrix.online/#org" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:640px;margin:12vh auto;padding:0 24px;font-family:system-ui,sans-serif;color:#F5F5F0;background:#0A0A0A;text-align:center">
        <h1 style="font-weight:600">FinatriX</h1>
        <p style="color:#8A8A8A;line-height:1.6">
          FinatriX needs JavaScript to run its interactive money tools. Please
          enable JavaScript in your browser, then reload this page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
