<!doctype html>
<!-- en-IN, not en: every schema node declares inLanguage "en-IN" and og:locale
     is "en_IN", so a bare "en" here was the one place the document disagreed
     with its own metadata about what it is. The regional subtag is also the
     honest description — the copy is written around ₹, Indian tax slabs and
     Indian instruments. Screen readers without an Indian English voice fall
     back to generic English, i.e. exactly today's behaviour. -->
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#060607" />
    <!-- Dev + fallback CSP. Production delivers the same policy (plus
         frame-ancestors) as an HTTP header — see public/_headers. Keep the
         two byte-identical: differing policies enforce their intersection. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-8sIkMSAQhH4cmqemj6kE1Bs/6aBQrXGsMGgKxYpye5g='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />

    <!-- No-flash theme boot: set data-theme from saved preference or OS before
         first paint. Kept in sync with the sha256 in the CSP above; if this
         script changes, recompute the hash. Mirrors ThemeContext defaults. -->
    <script>(function(){try{var d=document.documentElement;var t=localStorage.getItem('fx_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}d.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute('content',t==='light'?'#F4F2EC':'#060607');}}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>

    <!-- Fonts are self-hosted; preload the two render-critical variable fonts. -->
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Primary meta -->
    <title>FinatriX — Smart Money Tools for India</title>
    <meta
      name="description"
      content="Seven free, education-first money tools for India: budgeting, expenses, investing, benchmarking and a lifelong wealth simulation. Not financial advice."
    />
    <meta name="author" content="FinatriX" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://finatrix.co/" />

    <!--
      Icons — a responsive set, split at 64px.

      Both halves are the same mark. At and above 64px the full artwork ships
      unchanged, glyphs and all. Below 64px each tile is only ~3 pixels across,
      so the glyphs cannot resolve and a downscale of the raster returns mush;
      the small sizes therefore come from favicon.svg, a vector rebuild of the
      same composition — same tile positions, same colours, same gold core and
      white node — with the unresolvable per-tile glyphs omitted. Previously
      every slot pointed at the 1520px PNG and the browser downscaled it.

      `?v=` is a cache-busting token, NOT decoration. These filenames are fixed
      by convention, so a browser that cached the old icon would otherwise keep
      showing it — favicons are cached far more aggressively than pages, and
      /favicon.ico is often re-fetched only on a hard refresh. Bump the token
      whenever an icon's bytes change. Regenerate with scripts/generate-favicons.py.
    -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="mask-icon" href="/mask-icon.svg?v=3" color="#F1C40F" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinatriX" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FinatriX" />
    <meta property="og:title" content="FinatriX — Smart Money Tools for India" />
    <meta
      property="og:description"
      content="Seven free, education-first money tools for India: budgeting, expenses, investing, benchmarking and a lifelong wealth simulation. Not financial advice."
    />
    <meta property="og:url" content="https://finatrix.co/" />
    <meta property="og:locale" content="en_IN" />
    <!-- 1200×630 (1.91:1). The previous wordmark asset was 1206×314, which both
         Facebook and X centre-crop to an unreadable sliver in a large card. -->
    <meta
      property="og:image"
      content="https://finatrix.co/images/og-cover.jpg?v=2"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FinatriX — smart money tools for India" />

    <!-- Twitter.
         TODO(brand): re-add `twitter:site` / `twitter:creator` once an official
         X account exists. They previously named @finatrix_, which is not a
         registered handle (x.com/finatrix_ → HTTP 404), so every large card X
         rendered carried an attribution line linking to a dead profile — worse
         for trust than no attribution at all. `twitter:card` and the image tags
         below are handle-independent and the card still renders in full. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FinatriX — Smart Money Tools for India" />
    <!-- Identical to og:description on purpose: X falls back to the og: tags
         when a twitter: equivalent is absent, so a third variant of the same
         sentence was only ever a third string to keep true. `applySeo` and the
         edge Worker write the same value into both. -->
    <meta
      name="twitter:description"
      content="Seven free, education-first money tools for India: budgeting, expenses, investing, benchmarking and a lifelong wealth simulation. Not financial advice."
    />
    <meta
      name="twitter:image"
      content="https://finatrix.co/images/og-cover.jpg?v=2"
    />
    <meta name="twitter:image:alt" content="FinatriX — smart money tools for India" />

    <!-- Structured data: Organization (brand signal) + WebSite + WebApplication.
         Every @id is absolute and rooted at the canonical apex, so the brand
         entity migrates with the domain instead of being re-learned.

         TODO(brand): add a "sameAs" array to the Organization node listing every
         official social profile, once one exists. It previously claimed
         https://twitter.com/finatrix_ — a handle that is not registered
         (HTTP 404). `sameAs` is how a search engine confirms that a brand entity
         and a social profile are the same organisation; pointing it at a dead
         URL asks it to verify the brand against nothing, which is a weaker
         signal than omitting the property. Never list an unverified profile.
         (No comments below this line: the block is strict JSON.) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://finatrix.co/#org",
            "name": "FinatriX",
            "url": "https://finatrix.co/",
            "logo": "https://finatrix.co/images/finatrix-logo.png",
            "image": "https://finatrix.co/images/og-cover.jpg",
            "email": "finatrix.hub@gmail.com",
            "description": "Free, education-first personal-finance tools for India.",
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "finatrix.hub@gmail.com",
              "availableLanguage": ["en"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://finatrix.co/#website",
            "name": "FinatriX",
            "url": "https://finatrix.co/",
            "inLanguage": "en-IN",
            "publisher": { "@id": "https://finatrix.co/#org" }
          },
          {
            "@type": "WebApplication",
            "@id": "https://finatrix.co/#webapp",
            "name": "FinatriX",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "browserRequirements": "Requires JavaScript",
            "url": "https://finatrix.co/",
            "inLanguage": "en-IN",
            "description": "Free, education-first personal-finance tools for India. Educational tools, not financial advice.",
            "isPartOf": { "@id": "https://finatrix.co/#website" },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
            "publisher": { "@id": "https://finatrix.co/#org" }
          }
        ]
      }
    </script>

    <!-- Per-route structured data (BreadcrumbList / WebPage / SoftwareApplication).
         Ships EMPTY and is filled in per URL: the edge Worker writes it into the
         served bytes (`withSeoMetadata`), and `applySeo` rewrites it on every
         client-side navigation. The tag has to exist here rather than be injected,
         because both writers only ever replace the CONTENTS of head nodes that
         already exist — that is what keeps the served markup and the hydrated
         markup structurally identical.

         Type is `application/ld+json`, a data block rather than executable script,
         so the CSP above governs it without needing a hash. An empty block is
         ignored by every consumer, which is the correct state for a noindex URL. -->
    <script type="application/ld+json" id="fx-route-schema"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:640px;margin:12vh auto;padding:0 24px;font-family:system-ui,sans-serif;color:#F5F5F0;background:#060607;text-align:center">
        <h1 style="font-weight:600">FinatriX</h1>
        <p style="color:#8A8A8A;line-height:1.6">
          FinatriX needs JavaScript to run its interactive money tools. Please
          enable JavaScript in your browser, then reload this page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
