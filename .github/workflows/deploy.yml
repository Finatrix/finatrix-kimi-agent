# Continuous deployment on main: Cloudflare Workers (front end) AND the Supabase
# edge functions.
#
# The edge-function job exists because deploying them was previously a manual
# step. It was missed, and the live `careers-jobs` function ran a superseded
# provider contract for weeks — three providers silently returning nothing in
# production while every local gate stayed green. Shipping the front end without
# the functions is not "a partial deploy", it is a drift generator.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    — API token with "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID   — the account id shown by `npx wrangler whoami`
#   VITE_SUPABASE_URL       — inlined into the bundle at build time
#   VITE_SUPABASE_ANON_KEY  — inlined into the bundle at build time
#   VITE_ANALYTICS_URL      — inlined into the bundle at build time
#   SUPABASE_ACCESS_TOKEN   — personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF    — the project ref, e.g. from `supabase/.temp/project-ref`
#
# Each job fails fast with a clear message when its own secrets are absent, and
# never blocks the other. Manual deploys keep working regardless:
#   npm run build && npx wrangler deploy
#   npx supabase functions deploy careers-jobs careers-ai
#
# The preflight step in each job names EVERY missing secret in one run, and does
# it before `npm ci`. Both properties were learned the hard way: the checks used
# to be split across three steps in two jobs, the first of which bailed on
# `CLOUDFLARE_API_TOKEN` alone — so configuring this repository was a sequence of
# push, wait, discover one more missing name, repeat, and the two Cloudflare
# checks sat five minutes apart with the full gate suite between them.
# `CLOUDFLARE_ACCOUNT_ID` was in the list above but checked by nothing at all,
# surfacing instead as an opaque wrangler error after a successful build.
#
# Secrets are read through `env:` rather than interpolated into the `run:`
# script. `if [ -z "${{ secrets.FOO }}" ]` expands the VALUE into the command
# line, which the runner prints to the log before executing it; masking is the
# only thing standing between that and a published credential, and masking is a
# post-processing step on a string, not a guarantee.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Everything this job cannot succeed without, checked in one pass, before
      # any minutes are spent installing or testing.
      - name: Preflight — deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # VITE_* values are INLINED AT BUILD TIME. Building without them does
          # not fail — it silently produces a bundle with the feature compiled
          # out: `VITE_SUPABASE_URL` missing makes `isSupabaseConfigured` fold to
          # `false`, so the shipped app shows every visitor "the backend isn't
          # configured yet" and sign-in is dead, while every endpoint looks
          # perfectly healthy. `VITE_ANALYTICS_URL` missing makes
          # `analyticsEnabled()` fold to `return false`, so no event, error
          # report or web vital is ever sent. This exact bundle reached
          # production. It is a deploy credential in every sense that matters,
          # so it is checked here with the others.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ANALYTICS_URL: ${{ secrets.VITE_ANALYTICS_URL }}
        run: |
          missing=
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
                      VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_ANALYTICS_URL; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
              echo "  missing: $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Deploy cannot run — these repository secrets are not set:$missing. Add them under Settings → Secrets and variables → Actions. See docs/DEPLOYMENT.md §1."
            exit 1
          fi
          echo "All 5 deploy secrets are present."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Deploy only what passed the gates.
      #
      # Re-run here rather than depending on the CI workflow: Deploy triggers on
      # push to main independently, so a green CI run is not a precondition for
      # shipping. The dependency audit is part of that gate for the same reason
      # — it is the only workflow that reaches production, and it previously
      # shipped without ever checking advisories at all.
      - run: npx tsc -b && npx eslint . --max-warnings 0 && npx vitest run && npm run audit:prod
      # The build-time client config was verified by the preflight step above,
      # before any of this ran. `vite.config.ts` re-checks it as the build's own
      # last line of defence — that guard is what covers the manual
      # `npm run build && npx wrangler deploy` path, which this workflow never
      # observes. This job deliberately does NOT set
      # FX_ALLOW_UNCONFIGURED_BUILD: here the guard must bite.
      #
      # VITE_CANONICAL_ORIGIN is deliberately NOT passed. The canonical apex now
      # lives in exactly one place — CANONICAL_HOST in src/shared/routes.ts —
      # which the Worker, the SEO module and the tests all read. Threading it
      # through a repository secret as well meant a stale secret could silently
      # override correct code and publish canonical tags for a retired domain,
      # with every gate still green. Forks that need a different origin set it
      # in their own .env (see .env.example).
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ANALYTICS_URL: ${{ secrets.VITE_ANALYTICS_URL }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Proves the deploy is actually live and canonical on the real domain:
      # HTTPS, HSTS, the www → apex 301, self-canonical tags, robots, sitemap
      # and honest 404s. A green `wrangler deploy` only says the upload
      # succeeded — it says nothing about what finatrix.co now serves.
      #
      # VITE_SUPABASE_URL is what lets the two checks that matter most here run
      # at all. Without it `checkAuthRedirect` and `checkEdgeCors` report
      # "skipped" — and those are precisely the checks that exist because the
      # last domain migration passed every other assertion in the file while
      # login was completely broken (the Auth Site URL still named the old host,
      # so every confirmation, reset and OAuth callback landed off-site with no
      # session). Running this step without them verifies everything except the
      # failure it was written for.
      - name: Verify production domain
        run: npm run verify:production
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          # Not needed to deploy, but `verify:deploy` — which runs below,
          # before the deploy steps — cannot check anything without it, and a
          # verification step that cannot run is worth knowing about up front.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF \
                      VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
              echo "  missing: $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Edge functions will NOT be deployed and will drift from main — these repository secrets are not set:$missing. Add them under Settings → Secrets and variables → Actions. See docs/DEPLOYMENT.md §2."
            exit 1
          fi
          echo "All 4 edge-function secrets are present."
      # `HEAD^` is needed by the drift check below, which compares production
      # against the previous commit's edge-function sources.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The provider suite is the only automated check these functions have.
      - run: npx tsc -b && npx vitest run supabase/functions
      # Drift is checked BEFORE deploying, not after.
      #
      # Supabase's function store is read-after-write eventual by minutes: for
      # a long window after `functions deploy` succeeds, `functions download`
      # still returns the previous version. A post-deploy comparison therefore
      # reports every file of every function as drifted on a deploy that in
      # fact worked. Two attempts to wait it out (150s, then 450s) both
      # undershot; the same comparison passed on its first read minutes later.
      #
      # Run before the deploy and there is no write in flight, so the check is
      # exact — and it answers the question this job exists for: did the LAST
      # deploy actually land, or have the edge functions been drifting from
      # main while every gate stayed green? The comparison is against the
      # previous commit's sources, since production is not supposed to match
      # this one until the steps below run. A deploy that silently fails to
      # land is caught on the next run instead of never.
      - name: Verify the previous deploy landed
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          git archive HEAD^ supabase/functions | tar -x -C "$RUNNER_TEMP/previous"
          npm run verify:deploy
        env:
          FX_FUNCTIONS_ROOT: ${{ runner.temp }}/previous
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # careers-billing-checkout belongs here, not in the no-JWT step below: it
      # reads the caller's identity from their Authorization header to decide
      # who the subscription is for.
      - name: Deploy authenticated edge functions
        run: npx supabase functions deploy careers-jobs careers-ai careers-email careers-billing-checkout --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # careers-billing-webhook MUST be --no-verify-jwt for the same structural
      # reason as analytics-collect: Stripe calls it server-to-server and cannot
      # present a Supabase JWT, so with the gateway check on, every payment
      # event is rejected 401 before the function runs — the customer is charged
      # and never provisioned. It is not unauthenticated: trust comes from the
      # Stripe-Signature HMAC (supabase/functions/careers-billing-webhook/
      # signature.ts), which is unit-tested including the secret-rotation case.
      - name: Deploy Stripe webhook (no JWT gate — see comment)
        run: npx supabase functions deploy careers-billing-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # analytics-collect MUST be --no-verify-jwt. The browser sends its batches
      # with navigator.sendBeacon, which cannot set an Authorization header, so
      # with the gateway JWT check on, every beacon is rejected 401 before the
      # function runs — silently dropping 100% of analytics, error reports and
      # web vitals. It is safe: the endpoint is anonymous by design and is
      # bounded by per-IP rate limiting, strict allowlist validation, and a
      # table no client can read.
      - name: Deploy public analytics ingest (no JWT gate — see comment)
        run: npx supabase functions deploy analytics-collect --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
