name: CI

# Runs the full local gate suite (PROJECT-HANDOFF.md §19.6) on every branch
# push and PR — phase branches get the same protection as main.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Fails only on critical advisories in production dependencies.
      # (Known accepted risk at "high": xlsx — registry has no fixed version;
      # the patched build ships from SheetJS's own CDN. See docs/DEPLOYMENT.md.)
      - name: Dependency audit (production, critical only)
        run: npm audit --omit=dev --audit-level=critical

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds a production bundle and drives it in real Chromium (desktop +
      # mobile) — the Expense Tracker add/persist/edit/delete/undo lifecycle.
      - name: E2E (Playwright)
        run: npm run test:e2e
