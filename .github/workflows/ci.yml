name: CI

# Runs the full local gate suite (PROJECT-HANDOFF.md §19.6) on every branch
# push and PR — phase branches get the same protection as main.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # One source of truth for the runtime, shared with the deploy
          # workflow — a gate that runs on a different Node from the one that
          # builds production is not the same gate.
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc -b

      # `eslint-plugin-react-hooks` is pinned to ~7.0.x on purpose. 7.1 adds
      # `set-state-in-effect` / `purity` / `refs`, which flag 38 pre-existing
      # call sites across 14 careers pages — almost all the ordinary
      # "load data on mount" effect. They are worth adopting, but doing so is a
      # deliberate refactor of working screens, not a dependency bump, so it is
      # scheduled rather than dropped into a release-hardening pass.
      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Test
        run: npm test

      # A compile check, not a deployable artifact — this job has no VITE_*
      # secrets and its dist/ is thrown away. vite.config.ts fails a production
      # build with missing client config (that bundle has reached finatrix.co
      # twice), so this build states outright that it is not one to deploy.
      # The deploy workflow does NOT opt out: there the guard must bite.
      - name: Build
        run: npm run build
        env:
          FX_ALLOW_UNCONFIGURED_BUILD: '1'

      # Fails on any HIGH or CRITICAL advisory in production dependencies that
      # is not explicitly accepted, with its reachability argument, in
      # scripts/audit-production-deps.mjs.
      #
      # This replaced `npm audit --omit=dev --audit-level=critical`, which could
      # not distinguish "assessed and accepted" from "never noticed" — every
      # high advisory passed either way. pdfjs-dist shipped
      # GHSA-hq66-cqwq-w95j (arbitrary JS execution on opening a malicious PDF,
      # in the library that parses user-uploaded résumés) and this step stayed
      # green the whole time. The allowlist now lives in code, and a stale entry
      # fails the build too, so exemptions get deleted rather than inherited.
      - name: Dependency audit (production)
        run: npm run audit:prod

  e2e:
    runs-on: ubuntu-latest
    # ~21 minutes of real browser work at full green; the ceiling is here so a
    # hung browser is reported as one instead of burning six hours of runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds a production bundle and drives it in real Chromium (desktop +
      # mobile) — the Expense Tracker add/persist/edit/delete/undo lifecycle.
      # playwright.config.ts builds the bundle it serves. These specs drive the
      # on-device (guest) paths and need no backend, so the same opt-out as the
      # Build step above applies.
      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          FX_ALLOW_UNCONFIGURED_BUILD: '1'
