name: CI

# Runs the full local gate suite (PROJECT-HANDOFF.md §19.6) on every branch
# push and PR — phase branches get the same protection as main.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc -b

      # `eslint-plugin-react-hooks` is pinned to ~7.0.x on purpose. 7.1 adds
      # `set-state-in-effect` / `purity` / `refs`, which flag 38 pre-existing
      # call sites across 14 careers pages — almost all the ordinary
      # "load data on mount" effect. They are worth adopting, but doing so is a
      # deliberate refactor of working screens, not a dependency bump, so it is
      # scheduled rather than dropped into a release-hardening pass.
      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Test
        run: npm test

      # A compile check, not a deployable artifact — this job has no VITE_*
      # secrets and its dist/ is thrown away. vite.config.ts fails a production
      # build with missing client config (that bundle has reached finatrix.co
      # twice), so this build states outright that it is not one to deploy.
      # The deploy workflow does NOT opt out: there the guard must bite.
      - name: Build
        run: npm run build
        env:
          FX_ALLOW_UNCONFIGURED_BUILD: '1'

      # Fails only on critical advisories in production dependencies.
      # Advisories assessed and accepted below the "critical" bar — re-review
      # whenever this list changes (`npm audit --omit=dev`):
      #   • xlsx (high)        — registry has no fixed version; the patched build
      #     ships from SheetJS's own CDN. See docs/DEPLOYMENT.md.
      #   • react-router (high, GHSA-qwww-vcr4-c8h2) — RSC-mode CSRF bypass.
      #     Not reachable: the app uses only <BrowserRouter> + declarative
      #     <Routes>, no createBrowserRouter/RouterProvider, no route
      #     actions/loaders, no RSC. Fixed only in 8.3.0, i.e. a major upgrade —
      #     tracked as planned work, not a pre-launch change.
      # (dompurify's low advisory was resolved by an in-range bump and is gone.)
      - name: Dependency audit (production, critical only)
        run: npm audit --omit=dev --audit-level=critical

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds a production bundle and drives it in real Chromium (desktop +
      # mobile) — the Expense Tracker add/persist/edit/delete/undo lifecycle.
      # playwright.config.ts builds the bundle it serves. These specs drive the
      # on-device (guest) paths and need no backend, so the same opt-out as the
      # Build step above applies.
      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          FX_ALLOW_UNCONFIGURED_BUILD: '1'
