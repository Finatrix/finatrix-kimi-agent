name: CI

# Runs the full local gate suite (PROJECT-HANDOFF.md §19.6) on every branch
# push and PR — phase branches get the same protection as main.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
