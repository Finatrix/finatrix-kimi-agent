name: CI

# Runs the full local gate suite (PROJECT-HANDOFF.md §19.6) on every push to
# main, every pull request (tested as merged into its base) and every push to a
# branch with no open PR — phase branches get the same protection as main. A push to a branch with an open PR fires both `push` and
# `pull_request`; `pr-check` stands the push run down, so the suites run once,
# on the merge result.
on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: nothing here writes to the repository with GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Push runs on branches other than main only. When the branch has an open PR,
  # that PR's run tests this same commit merged into its base, so verify and
  # e2e are skipped here. A PR is often opened within a minute of its branch's
  # first push, so it looks once more after 45 s. It fails open: if the lookup
  # errors, the suites run. GitHub runs no pull_request workflow while a PR has
  # merge conflicts, so a conflicted PR gets no CI until they are resolved.
  pr-check:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      open-pr: ${{ steps.find.outputs.open-pr }}
    steps:
      - name: Look for an open PR from this branch
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wait in 0 45; do
            sleep "$wait"
            count=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open -f head="$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" \
              --jq length) || { echo "::warning::PR lookup failed"; count=0; }
            if [ "$count" -gt 0 ]; then
              echo "Open PR found: its pull_request run covers this commit."
              echo "open-pr=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No open PR from $GITHUB_REF_NAME: running the suites here."

  verify:
    needs: pr-check
    # !cancelled() lets this run when pr-check is skipped (main and PR runs).
    if: ${{ !cancelled() && needs.pr-check.outputs.open-pr != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc -b

      # `eslint-plugin-react-hooks` is pinned to ~7.0.x on purpose. 7.1 adds
      # `set-state-in-effect` / `purity` / `refs`, which flag 38 pre-existing
      # call sites across 14 careers pages — almost all the ordinary
      # "load data on mount" effect. They are worth adopting, but doing so is a
      # deliberate refactor of working screens, not a dependency bump, so it is
      # scheduled rather than dropped into a release-hardening pass.
      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Test
        run: npm test

      # A compile check, not a deployable artifact — this job has no VITE_*
      # secrets and its dist/ is thrown away. vite.config.ts fails a production
      # build with missing client config (that bundle has reached finatrix.co
      # twice), so this build states outright that it is not one to deploy.
      # The deploy workflow does NOT opt out: there the guard must bite.
      - name: Build
        run: npm run build
        env:
          FX_ALLOW_UNCONFIGURED_BUILD: '1'

      # Fails on any HIGH or CRITICAL advisory in production dependencies that
      # is not explicitly accepted, with its reachability argument, in
      # scripts/audit-production-deps.mjs.
      #
      # This replaced `npm audit --omit=dev --audit-level=critical`, which could
      # not distinguish "assessed and accepted" from "never noticed" — every
      # high advisory passed either way. pdfjs-dist shipped
      # GHSA-hq66-cqwq-w95j (arbitrary JS execution on opening a malicious PDF,
      # in the library that parses user-uploaded résumés) and this step stayed
      # green the whole time. The allowlist now lives in code, and a stale entry
      # fails the build too, so exemptions get deleted rather than inherited.
      - name: Dependency audit (production)
        run: npm run audit:prod

  e2e:
    needs: pr-check
    if: ${{ !cancelled() && needs.pr-check.outputs.open-pr != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # WebKit as well as Chromium: the iOS app renders in WKWebView, and
      # `e2e/ios-webkit.spec.ts` checks the things Chromium cannot answer for —
      # safe-area insets, WebKit layout and number parsing, and a real OCR
      # recognition. Without the binary that whole project would be skipped, and
      # an iOS regression would reach a TestFlight build instead of this step.
      - name: Install Playwright browsers (Chromium + WebKit)
        run: npx playwright install --with-deps chromium webkit

      # Builds a production bundle and drives it in real browsers — Chromium for
      # desktop and the Android-engine mobile viewport, WebKit for the iOS app.
      # playwright.config.ts builds the bundle it serves. These specs drive the
      # on-device (guest) paths and need no backend, so the same opt-out as the
      # Build step above applies.
      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          FX_ALLOW_UNCONFIGURED_BUILD: '1'
