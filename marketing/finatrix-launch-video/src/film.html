<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FinatriX launch film</title>
<style>
  @font-face { font-family: 'Geist'; src: url('../assets/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url('../assets/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; }
  :root {
    --base: #060607; --s2: #121214; --ink: #F5F5F0; --ink2: #9c9c96; --ink3: #8b8b90; --gold: #D4AF37;
    --gold-soft: #F0D779; --hair: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: var(--base); overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--base);
    font-family: 'Geist', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  #glow { width: 1080px; height: 1920px; pointer-events: none;
    background: radial-gradient(60% 38% at 50% 42%, rgba(212,175,55,.16), rgba(212,175,55,0) 70%); }
  #grain { width: 1080px; height: 1920px; opacity: .035; mix-blend-mode: overlay; pointer-events: none; }
  #vignette { width: 1080px; height: 1920px; pointer-events: none;
    background: radial-gradient(120% 80% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #flash { width: 1080px; height: 1920px; background: #F5F5F0; opacity: 0; pointer-events: none; }

  /* Headlines: compact, heavy, uppercase; each line reveals through its own mask. */
  .hl { left: 90px; width: 900px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.045em; line-height: .9; }
  .hl .ln { display: block; overflow: hidden; padding-bottom: .06em; margin-bottom: -.06em; }
  .hl .in { display: inline-block; white-space: nowrap; will-change: transform; }
  .gold { color: var(--gold); }
  .kick { left: 90px; font-family: 'Geist Mono', monospace; font-size: 40px; letter-spacing: .12em; line-height: 1; text-transform: uppercase;
    color: var(--gold); font-weight: 500; white-space: nowrap; }
  .note { left: 90px; width: 900px; font-size: 32px; color: var(--ink3); font-weight: 450; letter-spacing: -.005em; white-space: nowrap; }
  .chip { font-size: 42px; font-weight: 600; color: var(--gold); border: 2px solid rgba(212,175,55,.55); border-radius: 999px;
    padding: 10px 26px 12px; white-space: nowrap; background: rgba(212,175,55,.08); letter-spacing: -.01em; }

  /* The screen plane: a restrained bezel around the real captured UI. */
  .device { border-radius: 66px; padding: 12px; background: linear-gradient(160deg, #1b1b1e, #0b0b0d 40%, #0e0e10);
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.10), 0 60px 120px -30px rgba(0,0,0,.9), 0 0 120px -40px rgba(212,175,55,.25);
    transform-origin: 50% 50%; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 54px; overflow: hidden; background: #0A0A0A;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); isolation: isolate; }
  .screen img { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; max-width: none; }
  .focus { position: absolute; border: 4px solid var(--gold); box-shadow: 0 0 0 4000px rgba(6,6,7,.0), 0 0 40px rgba(212,175,55,.35); pointer-events: none; }
  .ripple { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(245,245,240,.55), rgba(245,245,240,.15) 60%, rgba(245,245,240,0) 70%); }
  .wipe { position: absolute; background: rgba(6,6,7,.72); }
  .scan { position: absolute; width: 4px; background: linear-gradient(var(--gold-soft), var(--gold)); box-shadow: 0 0 24px 6px rgba(212,175,55,.55); }
  .sheen { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.10) 48%, rgba(255,255,255,0) 60%); }

  /* Scene 0 figures */
  .fig { font-family: 'Geist Mono', monospace; font-weight: 500; white-space: nowrap; color: var(--ink2); }

  /* Scene 3 blocks */
  .blk { border-radius: 40px; background: #121214; box-shadow: inset 0 0 0 2px rgba(255,255,255,.12);
    display: flex; align-items: center; justify-content: center; font-weight: 800; letter-spacing: -.05em; line-height: 1; }
  .slash { width: 6px; height: 220px; border-radius: 3px; background: var(--gold); box-shadow: 0 0 24px rgba(212,175,55,.5); }

  /* Brand */
  #logoWrap { width: 300px; height: 300px; border-radius: 72px; overflow: hidden; transform-origin: 50% 50%;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.08), 0 40px 90px -20px rgba(0,0,0,.9); }
  #logoWrap img { width: 300px; height: 300px; display: block; }
  #word { font-weight: 600; font-size: 176px; letter-spacing: -.025em; white-space: nowrap; line-height: 1; }
  .tag { font-size: 60px; font-weight: 600; letter-spacing: -.03em; line-height: 1.12; text-align: center; width: 1080px; left: 0; white-space: nowrap; }
  .cta { font-size: 46px; font-weight: 500; letter-spacing: -.01em; text-align: center; width: 1080px; left: 0; white-space: nowrap; color: var(--ink); }
  .disc { font-size: 32px; color: var(--ink3); text-align: center; width: 1080px; left: 0; white-space: nowrap; letter-spacing: .01em; }
  #goldLine { height: 3px; background: linear-gradient(90deg, rgba(212,175,55,0), #F0D779 30%, #D4AF37 70%, rgba(212,175,55,0)); transform-origin: 50% 50%; }
  #bloom { width: 1000px; height: 1000px; border-radius: 50%; background: radial-gradient(circle, rgba(240,215,121,.45), rgba(212,175,55,.12) 35%, rgba(212,175,55,0) 65%); }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./film.js"></script>
</body>
</html>
